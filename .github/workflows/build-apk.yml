name: Build FT Cloner APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build native FT Cloner APK
        working-directory: cloner-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ft-cloner-apk
          path: cloner-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save APK in repository
        run: |
          mkdir -p apk
          cp cloner-android/app/build/outputs/apk/debug/app-debug.apk apk/FT-Cloner.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/FT-Cloner.apk
          if git diff --cached --quiet; then
            echo "APK already up to date"
          else
            git commit -m "Add built FT Cloner APK [skip ci]"
            git push
          fi
